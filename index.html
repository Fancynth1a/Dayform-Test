lendar','▦','Calendar'],['daily','◷','Daily'],['more','☷','More']].map(([id,icon,label])=>`<button ${id==='more'?'data-more-toggle="1"':`data-page="${id}"`} class="${(id==='more'?['plan','goals','journal'].includes(page):page===id)?'active':''}"><span class="bottom-icon">${icon}</span><span class="bottom-label">${label}</span></button>`).join('');const more=document.getElementById('mobileMore');if(more)more.classList.add('hidden')}function taskList(tasks){if(!tasks.length)return '<div class="empty">这里还没有任务，添加第一项吧。</div>';return tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''} aria-label="完成任务 ${safe(t.name)}"><div class="task-body"><div class="task-name">${safe(t.name)}</div><div class="meta">${safe(t.course||'个人任务')} · ${safe(dueText(t.due))} · ${safe(t.priority||'普通')}</div></div><button class="ghost" data-edit="${t.id}" aria-label="编辑">编辑</button><button class="ghost danger" data-delete="${t.id}" aria-label="删除">×</button></div>`).join('')}function taskForm(){const t=data.tasks.find(x=>x.id===editingTask)||{};return `<form id="taskForm" class="form"><label class="field">任务名称<input name="name" maxlength="100" required placeholder="例如：完成小组作业" value="${safe(t.name||'')}"></label><div class="formrow"><label class="field">所属课程<input name="course" maxlength="50" placeholder="例如：专业课" value="${safe(t.course||'')}"></label><label class="field">截止日期<input type="date" name="due" value="${safe(t.due||((page==='calendar')?calendarSelected:iso()))}"></label></div><label class="field">优先级<select name="priority"><option ${t.priority==='普通'?'selected':''}>普通</option><option ${t.priority==='重要'?'selected':''}>重要</option><option ${t.priority==='紧急'?'selected':''}>紧急</option></select></label><div class="between"><button class="primary" type="submit">${editingTask?'保存修改':'添加任务'}</button><button type="button" class="secondary" data-close-form>取消</button></div></form>`}function home(){const today=iso();const current=data.tasks.filter(t=>!t.done&&(!t.due||t.due<=today));const todayAll=data.tasks.filter(t=>!t.due||t.due<=today);const completed=todayAll.filter(t=>t.done).length;const pct=todayAll.length?Math.round(completed/todayAll.length*100):0;const classes=data.classes.filter(c=>Number(c.day)===new Date().getDay()).sort((a,b)=>a.time.localeCompare(b.time));const upcoming=data.tasks.filter(t=>!t.done&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);return `<h1>Make today count.</h1><p class="muted">把今天需要做的事，安排得清清楚楚。</p><section class="panel section"><div class="between"><div><div class="eyebrow">TODAY'S PROGRESS</div><div class="stats" style="margin-top:9px">${completed} <span class="muted">/ ${todayAll.length} 项完成</span></div></div><div class="stats">${pct}%</div></div><div class="progress"><div style="width:${pct}%"></div></div></section><div class="grid section"><div class="stack"><section class="panel"><div class="between"><h2>Today's Tasks</h2><button class="primary small" data-open-form>+ 新任务</button></div><div id="taskFormSlot"></div>${taskList([...current,...todayAll.filter(t=>t.done)])}<p class="note">首页显示今天截止、已逾期或未设置日期的任务。其他任务在 Plan 页面查看。</p></section><section class="panel"><div class="between"><h2>Upcoming Deadlines</h2><button class="secondary small" data-page="plan">查看全部</button></div>${upcoming.length?upcoming.map(t=>`<div class="item between"><div><b style="font-size:13px">${safe(t.name)}</b><div class="meta">${safe(t.course||'个人任务')} · ${fmt(t.due)}</div></div><span class="pill">${safe(dueText(t.due))}</span></div>`).join(''):'<div class="empty">暂时没有待截止任务。</div>'}</section></div><div class="stack"><section class="panel"><div class="between"><h2>Today's Classes</h2><button class="secondary small" data-page="plan">课程表</button></div>${classes.length?classes.map(c=>`<div class="item"><b style="font-size:14px">${safe(c.name)}</b><div class="meta">${safe(c.time)} · ${safe(c.place||'未填写教室')}</div></div>`).join(''):'<div class="empty">今天没有录入课程。</div>'}</section><section class="panel"><div class="between"><h2>Goals</h2><button class="secondary small" data-page="goals">查看目标</button></div>${data.goals.length?data.goals.slice(0,3).map(g=>`<div class="item"><b style="font-size:13px">${safe(g.name)}</b><div class="meta">${safe(dueText(g.due))}</div></div>`).join(''):'<div class="empty">给自己设定一个小目标吧。</div>'}</section></div></div>`}function plan(){const sorted=[...data.tasks].sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999'));return `<h1>Plan your week.</h1><p class="muted">课程表与任务安排，放在同一个地方。</p><div class="grid section"><section class="panel"><div class="between"><h2>All Tasks</h2><button class="primary small" data-open-form>+ 新任务</button></div><div id="taskFormSlot"></div>${taskList(sorted)}</section><section class="panel"><h2>Weekly Classes</h2><div class="daytabs">${days.map((d,i)=>`<button class="${selectedDay===i?'active':''}" data-day="${i}">${d}</button>`).join('')}</div>${data.classes.filter(c=>Number(c.day)===selectedDay).sort((a,b)=>a.time.localeCompare(b.time)).map(c=>`<div class="item between"><div><b>${safe(c.name)}</b><div class="meta">${safe(c.time)} · ${safe(c.place||'未填写教室')}</div></div><button class="ghost danger" data-delete-class="${c.id}">删除</button></div>`).join('')||'<div class="empty">这一天还没有课程。</div>'}<form class="form" id="classForm"><label class="field">课程名称<input name="name" required maxlength="60" placeholder="例如：专业课"></label><div class="formrow"><label class="field">星期<select name="day">${days.map((d,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">上课时间<input type="time" name="time" required value="09:00"></label></div><label class="field">教室（选填）<input name="place" maxlength="50" placeholder="例如：A301"></label><button class="primary" type="submit">添加课程</button></form></section></div>`}function goals(){return `<h1>Keep your goals in sight.</h1><p class="muted">记录考试、学期目标和重要里程碑。</p><div class="grid section"><section class="panel"><h2>My Goals</h2>${data.goals.map(g=>`<div class="item between"><div><b>${safe(g.name)}</b><div class="meta">${fmt(g.due)} · ${safe(dueText(g.due))}</div></div><button class="ghost danger" data-delete-goal="${g.id}">删除</button></div>`).join('')||'<div class="empty">还没有目标。</div>'}</section><section class="panel"><h2>New Goal</h2><form class="form" id="goalForm"><label class="field">目标名称<input name="name" maxlength="100" required placeholder="例如：完成本学期学习目标"></label><label class="field">目标日期<input type="date" name="due" required value="${iso()}"></label><button class="primary" type="submit">添加目标</button></form></section></div>`}function journal(){const entries=[...data.journals].sort((a,b)=>b.date.localeCompare(a.date));return `<h1>Reflect & grow.</h1><p class="muted">写下今天的学习收获，记录自己的成长。</p><div class="grid section"><section class="panel"><h2>New Entry</h2><form class="form" id="journalForm"><label class="field">日期<input type="date" name="date" required value="${iso()}"></label><label class="field">今天学到了什么？<textarea name="content" maxlength="2000" required placeholder="记录一点进步，或者一个值得反思的问题……"></textarea></label><button class="primary" type="submit">保存学习记录</button></form></section><section class="panel"><h2>My Journal</h2>${entries.map(e=>`<div class="item"><div class="between"><b style="font-size:13px">${fmt(e.date)}</b><button class="ghost danger" data-delete-journal="${e.id}">删除</button></div><p class="journal">${safe(e.content)}</p></div>`).join('')||'<div class="empty">还没有学习记录。</div>'}</section></div>`}function calendar(){const first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,daysInMonth=new Date(calendarYear,calendarMonth+1,0).getDate();const cells=[];for(let i=0;i<42;i++){const date=new Date(calendarYear,calendarMonth,1-offset+i),key=iso(date),inMonth=date.getMonth()===calendarMonth,items=data.tasks.filter(t=>t.due===key),dayPlans=data.dailyPlans.filter(p=>p.date===key);cells.push(`<button type="button" class="cal-day ${inMonth?'':'other'} ${key===iso()?'today':''} ${key===calendarSelected?'selected':''}" data-cal-date="${key}" aria-label="${key}，${items.length}项任务，${dayPlans.length}项每日计划"><span>${date.getDate()}</span>${items.length?`<span class="cal-dot"></span><span class="cal-count">${items.length}项</span>`:''}${dayPlans.length?`<span class="cal-plan-dot" title="${dayPlans.length}项每日计划"></span>`:''}</button>`)}const tasks=data.tasks.filter(t=>t.due===calendarSelected);const complete=tasks.filter(t=>t.done).length;const dayPlans=data.dailyPlans.filter(p=>p.date===calendarSelected).sort((a,b)=>a.start.localeCompare(b.start));return `<h1>Study calendar.</h1><p class="muted">为每一天安排学习任务，慢慢建立自己的节奏。</p><div class="calendar-layout section"><section class="panel"><div class="calendar-head"><h2>${calendarYear}年${calendarMonth+1}月</h2><div class="calendar-controls"><button class="secondary small" data-cal-prev aria-label="上个月">‹</button><button class="secondary small" data-cal-today>今天</button><button class="secondary small" data-cal-next aria-label="下个月">›</button></div></div><div class="calendar-week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-days">${cells.join('')}</div><p class="note">黑点代表截止任务，灰点代表每日计划；点击日期查看安排。</p></section><section class="panel"><div class="between"><div><div class="eyebrow">SELECTED DAY</div><h2 style="margin-top:6px">${fmt(calendarSelected)}</h2></div><span class="pill">${complete}/${tasks.length} 完成</span></div><div class="progress"><div style="width:${tasks.length?Math.round(complete/tasks.length*100):0}%"></div></div><div style="margin-top:12px">${taskList(tasks)}</div><button class="primary" data-open-form style="margin-top:12px">+ 为这天添加任务</button><div id="taskFormSlot"></div><div class="calendar-plan-preview"><div class="between"><h2>每日计划</h2><span class="pill">${dayPlans.length} 项</span></div>${dayPlans.length?`<ul>${dayPlans.map(p=>`<li>${p.done?'✓ ':'○ '}${safe(p.start)}–${safe(p.end)} · ${safe(p.name)}</li>`).join('')}</ul>`:'<div class="empty">这一天还没有每日计划。</div>'}<button type="button" class="secondary" data-cal-open-daily>查看 / 安排这一天</button></div><div class="backup-actions"><button class="secondary small" data-backup>导出数据备份</button></div><p class="note">任务与每日计划相互独立，点击日期可查看两种安排。</p></section></div>`}
function daily(){
const items=data.dailyPlans.filter(p=>p.date===dailySelected).sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
const done=items.filter(p=>p.done).length,percent=items.length?Math.round(done/items.length*100):0;
const moving=data.dailyPlans.find(p=>p.id===movingDaily);
const moveBox=moving?`<div class="move-panel"><h3>调整计划日期</h3><p class="muted">${safe(moving.name)} · 由你决定是否移动，未完成计划不会自动顺延。</p><form id="moveDailyForm" class="form"><label class="field">移动到哪一天？<input type="date" name="moveDate" value="${iso(new Date(new Date(moving.date+'T12:00:00').getTime()+86400000))}" required></label><div class="formrow"><label class="field">开始时间<input type="time" name="moveStart" value="${safe(moving.start)}" required></label><label class="field">结束时间<input type="time" name="moveEnd" value="${safe(moving.end)}" required></label></div><div class="between"><button class="primary" type="submit">确认移动</button><button class="secondary" type="button" data-move-cancel>取消</button></div></form><p class="note">仅移动当前这一项，其他日期的计划不会改变。</p></div>`:'';
return `<h1>Plan your day.</h1><p class="muted">每天的时间安排，都可以从这里开始。未完成的计划由你决定是否调整。</p><div class="grid section"><section class="panel"><div class="between"><div><div class="eyebrow">DAILY PLANNER</div><h2 style="margin-top:6px">${fmt(dailySelected)}</h2></div><button class="secondary small" data-daily-today>回到今天</button></div><label class="field" style="margin:16px 0">选择计划日期<span class="daily-date-control"><span class="daily-date-display" aria-hidden="true">${safe(dailySelected)} <span class="daily-date-chevron">▦</span></span><input type="date" id="dailyDate" value="${dailySelected}" aria-label="选择计划日期"></span></label><div class="between"><span class="muted">完成 ${done} / ${items.length} 项</span><b>${percent}%</b></div><div class="progress"><div style="width:${percent}%"></div></div><div class="timeline-list">${items.length?items.map(p=>`<div class="timeline-entry ${p.done?'completed':''}"><div class="timeline-main"><input type="checkbox" data-daily-check="${safe(p.id)}" ${p.done?'checked':''} aria-label="完成计划 ${safe(p.name)}"><div class="timeline-body"><b>${safe(p.name)}</b><div class="timeline-clock">${safe(p.start)}–${safe(p.end)}</div>${p.note?`<div class="meta">${safe(p.note)}</div>`:''}<div class="timeline-actions"><button class="ghost" data-daily-edit="${safe(p.id)}">编辑</button><button class="ghost" data-daily-copy="${safe(p.id)}">复制此项</button>${!p.done?`<button class="ghost" data-move-open="${safe(p.id)}">调整日期</button>`:''}<button class="ghost danger" data-daily-delete="${safe(p.id)}">删除</button></div></div></div></div>`).join(''):'<div class="empty">这一天还没有安排，添加第一项计划吧。</div>'}</div>${moveBox}<details class="copy-day-form"><summary><span>复制当天全部计划</span><span class="copy-chevron" aria-hidden="true">⌄</span></summary><form id="copyDayForm"><p class="muted">选择目标日期，原计划保持不变；复制后可逐项修改。</p><label class="field">复制到哪一天？<input type="date" name="targetDate" required value="${iso(new Date(new Date(dailySelected+'T12:00:00').getTime()+86400000))}"></label><button class="secondary" type="submit" ${items.length?'':'disabled'}>复制当天 ${items.length} 项计划</button></form></details><div class="backup-actions"><button class="secondary small" data-backup>导出数据备份</button></div></section><section class="panel"><h2 id="dailyFormTitle">${editingDaily?'编辑每日计划':copyingDaily?'复制计划 · 可修改':'Add a plan'}</h2><form class="form" id="dailyForm"><label class="field">计划内容<input name="name" maxlength="100" required placeholder="例如：整理课堂笔记"></label><div class="formrow"><label class="field">开始时间<input type="time" name="start" value="09:00" required></label><label class="field">结束时间<input type="time" name="end" value="10:00" required></label></div><label class="field">备注（选填）<input name="note" maxlength="180" placeholder="例如：整理第三章重点"></label><div class="between"><button class="primary" type="submit">${editingDaily?'保存修改':copyingDaily?'保存副本':'添加计划'}</button>${editingDaily||copyingDaily?'<button type="button" class="secondary" data-daily-cancel>取消</button>':''}</div></form><p class="note">计划会按开始时间自动排序。日期调整需要手动确认，不会自动顺延。</p></section></div>`}
let copyingDaily=null;function fillDailyForm(){if(copyingDaily){const p=data.dailyPlans.find(x=>x.id===copyingDaily);const f=document.getElementById('dailyForm');if(!p||!f)return;f.elements.name.value=p.name;f.elements.start.value=p.start;f.elements.end.value=p.end;f.elements.note.value=p.note||'';return}if(!editingDaily)return;const p=data.dailyPlans.find(x=>x.id===editingDaily);const f=document.getElementById('dailyForm');if(!p||!f)return;f.elements.name.value=p.name;f.elements.start.value=p.start;f.elements.end.value=p.end;f.elements.note.value=p.note||''}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Dayform',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='dayform-backup-'+iso()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已生成，请保存到安全位置')}
function render(){nav();document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());document.getElementById('view').innerHTML=({home,plan,daily,calendar,goals,journal}[page])();}function showForm(){document.getElementById('taskFormSlot').innerHTML=taskForm();document.querySelector('#taskForm input[name=name]').focus()}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if('dailyToday'in d){dailySelected=iso();editingDaily=null;movingDaily=null;render()}else if('moveCancel'in d){movingDaily=null;render()}else if(d.moveOpen){movingDaily=d.moveOpen;editingDaily=null;render()}else if('calOpenDaily'in d){dailySelected=calendarSelected;page='daily';editingDaily=null;movingDaily=null;render();window.scrollTo(0,0)}else if('dailyCancel'in d){editingDaily=null;copyingDaily=null;render()}else if(d.dailyCopy){copyingDaily=d.dailyCopy;editingDaily=null;render();fillDailyForm();document.getElementById('dailyForm').scrollIntoView({behavior:'smooth',block:'center'})}else if(d.dailyEdit){copyingDaily=null;editingDaily=d.dailyEdit;render();fillDailyForm()}else if(d.dailyDelete){if(confirm('确定删除这条每日计划吗？')){movingDaily=null;data.dailyPlans=data.dailyPlans.filter(p=>p.id!==d.dailyDelete);editingDaily=null;save();render()}}else if(d.calDate){calendarSelected=d.calDate;const dt=new Date(d.calDate+'T12:00:00');calendarYear=dt.getFullYear();calendarMonth=dt.getMonth();render()}else if('calPrev'in d||'calNext'in d){const dt=new Date(calendarYear,calendarMonth+('calNext'in d?1:-1),1);calendarYear=dt.getFullYear();calendarMonth=dt.getMonth();render()}else if('calToday'in d){calendarSelected=iso();calendarYear=new Date().getFullYear();calendarMonth=new Date().getMonth();render()}else if('backup'in d){exportBackup()}else if('moreToggle'in d){document.getElementById('mobileMore').classList.toggle('hidden')}else if(d.page){page=d.page;editingTask=null;movingDaily=null;render();window.scrollTo(0,0)}else if('openForm'in d){editingTask=null;showForm()}else if('closeForm'in d){editingTask=null;document.getElementById('taskFormSlot').innerHTML=''}else if(d.edit){editingTask=d.edit;showForm()}else if(d.delete){if(confirm('确定删除这项任务吗？')){data.tasks=data.tasks.filter(t=>t.id!==d.delete);save();render()}}else if(d.day!==undefined){selectedDay=Number(d.day);render()}else if(d.deleteClass){data.classes=data.classes.filter(c=>c.id!==d.deleteClass);save();render()}else if(d.deleteGoal){data.goals=data.goals.filter(g=>g.id!==d.deleteGoal);save();render()}else if(d.deleteJournal){data.journals=data.journals.filter(j=>j.id!==d.deleteJournal);save();render()}});document.addEventListener('change',e=>{if(e.target.id==='dailyDate'){dailySelected=e.target.value||iso();editingDaily=null;movingDaily=null;render()}else if(e.target.dataset.dailyCheck){const p=data.dailyPlans.find(x=>x.id===e.target.dataset.dailyCheck);if(p){p.done=e.target.checked;save();render()}}else if(e.target.dataset.check){const t=data.tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();render()}}});document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='copyDayForm'){const target=String(fd.get('targetDate')||'');const source=dailySelected;const copies=data.dailyPlans.filter(p=>p.date===source);if(!target||target===source){toast('请选择不同的目标日期');return}if(!copies.length){toast('当天没有可复制的计划');return}if(!confirm('将 '+copies.length+' 项计划复制到 '+target+'？原计划会保留。'))return;for(const p of copies){data.dailyPlans.push({...p,id:uid(),date:target,done:false})}dailySelected=target;editingDaily=null;copyingDaily=null;save();render();toast('已复制 '+copies.length+' 项，可逐项编辑')}else if(f.id==='moveDailyForm'){const p=data.dailyPlans.find(x=>x.id===movingDaily);if(!p){movingDaily=null;render();return}const date=String(fd.get('moveDate')||''),start=String(fd.get('moveStart')||''),end=String(fd.get('moveEnd')||'');if(!date||!start||!end||end<=start){toast('请选择日期，且结束时间需要晚于开始时间');return}p.date=date;p.start=start;p.end=end;movingDaily=null;editingDaily=null;dailySelected=date;save();render();toast('计划已移动到所选日期')}else if(f.id==='dailyForm'){const name=String(fd.get('name')||'').trim(),start=String(fd.get('start')||''),end=String(fd.get('end')||'');if(!name||!start||!end)return;if(end<=start){toast('结束时间需要晚于开始时间');return}const item={name,start,end,note:String(fd.get('note')||'').trim(),date:dailySelected};if(editingDaily){const p=data.dailyPlans.find(x=>x.id===editingDaily);if(p)Object.assign(p,item)}else data.dailyPlans.push({id:uid(),done:false,...item});editingDaily=null;copyingDaily=null;save();render();toast('每日计划已保存')}else if(f.id==='taskForm'){const name=String(fd.get('name')).trim();if(!name)return;const item={name,course:String(fd.get('course')).trim(),due:String(fd.get('due')),priority:String(fd.get('priority'))};if(editingTask){const t=data.tasks.find(x=>x.id===editingTask);if(t)Object.assign(t,item)}else data.tasks.push({id:uid(),done:false,...item});editingTask=null;save();render();toast('任务已保存')}else if(f.id==='classForm'){data.classes.push({id:uid(),name:String(fd.get('name')).trim(),day:Number(fd.get('day')),time:String(fd.get('time')),place:String(fd.get('place')).trim()});selectedDay=Number(fd.get('day'));save();render();toast('课程已添加')}else if(f.id==='goalForm'){data.goals.push({id:uid(),name:String(fd.get('name')).trim(),due:String(fd.get('due'))});save();render();toast('目标已添加')}else if(f.id==='journalForm'){data.journals.push({id:uid(),date:String(fd.get('date')),content:String(fd.get('content')).trim()});save();render();toast('记录已保存')}});render();if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
